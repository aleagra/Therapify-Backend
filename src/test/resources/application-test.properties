# In-memory H2 profile for @SpringBootTest, so contextLoads etc. don't need a local/CI
# Postgres instance. PostgreSQL-compatibility mode keeps most JPQL/DDL behavior close enough.
spring.datasource.url=jdbc:h2:mem:therapify-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.main.lazy-initialization=false
