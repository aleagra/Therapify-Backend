spring.application.name=therapify
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/therapify}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
server.port=${PORT:8080}
spring.main.lazy-initialization=true

# HikariCP: kept modest (small hosted Postgres instance) but explicit, with a short
# connection-timeout so a DB hiccup fails fast instead of stacking on top of the ~325ms
# client RTT.
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Gzip compression for JSON/HTML/text responses above 1KB
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# Short-TTL in-memory cache (Caffeine) for doctor listing/detail queries, so the 30-day
# AvailabilityCalculator expansion isn't redone on every identical request.
spring.cache.type=caffeine
spring.cache.cache-names=doctorListings,userDetail
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=2m